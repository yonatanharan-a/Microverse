<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Microverse — a catalog of arthropods and terrarium life. Browse species, photos, videos, and care information." />
  <title>Microverse</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Emoji favicon so the tab has an icon with no extra files -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪲</text></svg>" />
</head>
<body>
  <!-- ===================== HEADER ===================== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">🪲</span>
        <div class="brand-text">
          <h1>Microverse</h1>
        </div>
      </div>

      <div class="header-actions">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </div>

    <!-- Search + controls -->
    <div class="controls">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Search by name, description, or care notes…"
          aria-label="Search species"
          autocomplete="off"
        />
      </div>
    </div>

    <!-- Category tabs are generated by script.js -->
    <nav id="categoryTabs" class="category-tabs" aria-label="Categories"></nav>
  </header>

  <!-- ===================== MAIN ===================== -->
  <main class="container">
    <p id="resultCount" class="result-count" aria-live="polite"></p>

    <!-- Species cards are generated by script.js -->
    <section id="speciesGrid" class="species-grid"></section>

    <!-- Shown when no species match the filters -->
    <p id="emptyState" class="empty-state" hidden>
      No species match your search. Try a different keyword or category.
    </p>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <p>יונתן הרן &mdash; <a href="tel:0507978348">050-797-8348</a></p>
  </footer>

  <!-- ===================== DETAIL MODAL ===================== -->
  <!-- A single reusable modal is filled in with species data on click -->
  <div id="speciesModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
      <div id="modalContent" class="modal-content"><!-- filled by script.js --></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
